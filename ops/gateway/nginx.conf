# O certificado e a chave sao gerados no host e montados somente no gateway.
# As variaveis no proxy_pass fazem o Nginx resolver os servicos via DNS do Docker
# em vez de fixar os enderecos retornados pelo resolver.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Somente falhas HTTP entram no access log; /health permanece sempre silencioso.
map "$request_uri:$status" $loggable_request {
    default 0;
    ~^(?!/health:).*:[45][0-9][0-9]$ 1;
}

# Log estruturado para diagnostico de uploads, latencia e streams interrompidos.
# $time_iso8601 e $msec juntos preservam horario legivel e precisao em ms.
log_format seiia_access escape=json
    '{"time":"$time_iso8601",'
    '"msec":"$msec",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_length":$request_length,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"traceparent":"$http_traceparent"}';

server {
    listen 8088 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/seiia.cert.pem;
    ssl_certificate_key /etc/ssl/private/seiia.cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    access_log /dev/stdout seiia_access if=$loggable_request;

    set $assistente_upstream http://assistente:8088;

    location / {
        proxy_pass $assistente_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    client_max_body_size 100M;
}

server {
    listen 8082 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/seiia.cert.pem;
    ssl_certificate_key /etc/ssl/private/seiia.cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    access_log /dev/stdout seiia_access if=$loggable_request;

    set $similaridade_upstream http://similaridade:8082;

    location / {
        proxy_pass $similaridade_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;

        proxy_read_timeout 280s;
    }

    # Gunicorn recebia o corpo sem um limite do proxy antes da migracao.
    client_max_body_size 0;
}

