name: sei-ia

x-websearch-common: &websearch-common
  restart: unless-stopped
  networks:
    - seiia
  profiles:
    - web-search

x-app-common: &app-common
  restart: unless-stopped
  networks:
    - seiia
  env_file:
    - default.env
    - security.env
  environment:
    SEI_API_DB_ADDRESS: ${SEI_ADDRESS}/sei/controlador_ws.php

x-airflow-common: &airflow-common
  image: sei-ia/etl-airflow:local
  restart: unless-stopped
  networks:
    - seiia
  env_file:
    - default.env
    - security.env
  environment:
    AIRFLOW_API_BASE_URL: http://etl-airflow-webserver:8080/api/v1
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:?Defina AIRFLOW_POSTGRES_PASSWORD em security.env}@infra-postgres-airflow:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:?Defina AIRFLOW_POSTGRES_PASSWORD em security.env}@infra-postgres-airflow:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__BROKER_URL: amqp://${AIRFLOW_AMQP_USER:-airflow}:${AIRFLOW_AMQP_PASSWORD:?Defina AIRFLOW_AMQP_PASSWORD em security.env}@infra-rabbitmq:5672//
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: ${AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG}
    SEI_API_DB_ADDRESS: ${SEI_ADDRESS}/sei/controlador_ws.php
    SOLR_MLT_PROCESS_CORE: ${SOLR_MLT_PROCESS_CORE}
    SOLR_MLT_JURISPRUDENCE_CORE: ${SOLR_MLT_JURISPRUDENCE_CORE}
    MLT_PROCESS_CONFIGSET: /var/solr/configsets/process
    MLT_JURISPRUDENCE_CONFIGSET: /var/solr/configsets/jurisprudence
    CONN_STRING_APP_DB: postgresql+psycopg2://${DB_SEIIA_USER:-postgres}:${DB_SEIIA_PWD:?Defina DB_SEIIA_PWD em security.env}@infra-postgres:5432/${DB_SEIIA_SIMILARIDADE:-sei_similaridade}
    CONN_LOG_DB_STRING: postgresql+psycopg2://${DB_SEIIA_USER:-postgres}:${DB_SEIIA_PWD:?Defina DB_SEIIA_PWD em security.env}@infra-postgres:5432/${DB_SEIIA_SIMILARIDADE:-sei_similaridade}
    LITELLM_PROXY_URL: http://infra-litellm:4000
    EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    LITELLM_EMBEDDING_MODEL_NAME: embedding
    EMBEDDING_BASE_MODEL: ${LITELLM_EMBEDDING_MODEL}
    EMBEDDING_DIM: ${EMBEDDING_DIM}
  volumes:
    - ${VOL_SEIIA_DIR}/airflow_logs_vol:/opt/airflow/logs
  depends_on:
    infra-postgres-airflow:
      condition: service_healthy
    infra-rabbitmq:
      condition: service_healthy
    infra-postgres:
      condition: service_healthy
    infra-solr:
      condition: service_healthy
    infra-redis:
      condition: service_started
    infra-litellm:
      condition: service_healthy

services:
  assistente:
    <<: *app-common
    networks:
      seiia:
        aliases:
          - api_assistente
    build:
      context: .
      network: host
      dockerfile: aplicacoes/assistente/assistente.dockerfile
    image: sei-ia/assistente:local
    command: >
      python -m gunicorn sei_ia.main:app -c /app/aplicacoes/assistente/sei_ia/configs/gunicorn_conf.py
      --forwarded-allow-ips="*"
    environment:
      SEI_API_DB_ADDRESS: ${SEI_ADDRESS}/sei/controlador_ws.php
      # A porta do processo fica fixa na rede Docker; ASSISTENTE_PORT continua
      # sendo a porta publicada pelo gateway para o contrato externo.
      ASSISTENTE_PORT: 8088
      ASSISTENTE_EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL}
      ASSISTENTE_EMBEDDING_DIMENSION: ${EMBEDDING_DIM}
      ASSISTENTE_LITELLM_PROXY_API_KEY: ${LITELLM_PROXY_API_KEY:?Defina LITELLM_PROXY_API_KEY em security.env}
    volumes:
      # Filesystem das sessoes Deep Agents (/llm_lang/session_stream): persiste
      # entre restarts e e compartilhado entre os workers do gunicorn.
      - ${VOL_SEIIA_DIR}/session_fs_vol:/var/seiia/sessions
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
    depends_on:
      infra-postgres:
        condition: service_healthy
      infra-redis:
        condition: service_started
      infra-litellm:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${ASSISTENTE_MEM_LIMIT}
          cpus: ${ASSISTENTE_CPU_LIMIT}

  gateway-nginx:
    image: nginx:1.27-alpine3.19-perl@sha256:e31ac2a0f5876ac4d71051f07dcd053c3fd68cd96cf18607565ffbd278c22db2
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      seiia:
        aliases:
          - ${NB_USER:-seiia}
          - ${SEIIA_GATEWAY_HOST:?Defina SEIIA_GATEWAY_HOST em security.env}
    ports:
      - "${ASSISTENTE_PORT:-8088}:8088"
      - "8082:8082"
      - "8086:8086"
    expose:
      - "8088"
      - "8082"
      - "8086"
    volumes:
      - ./ops/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.runtime/certs/seiia.cert.pem:/etc/ssl/certs/seiia.cert.pem:ro
      - ./.runtime/certs/seiia.cert.key:/etc/ssl/private/seiia.cert.key:ro
    depends_on:
      assistente:
        condition: service_healthy
      similaridade:
        condition: service_healthy
      similaridade-feedback:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_NGINX_MEM_LIMIT}
          cpus: ${GATEWAY_NGINX_CPU_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --no-check-certificate https://127.0.0.1:8088/health >/dev/null && wget -qO- --no-check-certificate https://127.0.0.1:8082/health >/dev/null && wget -qO- --no-check-certificate https://127.0.0.1:8086/health >/dev/null",
        ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    environment: { TZ: "${TZ:-America/Sao_Paulo}" }

  similaridade:
    <<: *app-common
    build:
      context: .
      network: host
      dockerfile: aplicacoes/similaridade/api_sei.dockerfile
    image: sei-ia/similaridade:local
    command: >
      gunicorn -k uvicorn.workers.UvicornH11Worker --workers=2
      --forwarded-allow-ips="*"
      --bind=0.0.0.0:8082 api_sei.main:app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      infra-postgres:
        condition: service_healthy
      infra-solr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${API_SEI_MEM_LIMIT}
          cpus: ${API_SEI_CPU_LIMIT}

  similaridade-feedback:
    <<: *app-common
    image: sei-ia/similaridade:local
    command: >
      gunicorn -k uvicorn.workers.UvicornH11Worker
      --forwarded-allow-ips="*"
      --bind=0.0.0.0:8086 app_api.main:app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      infra-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${APP_API_MEM_LIMIT}
          cpus: ${APP_API_CPU_LIMIT}

  etl-airflow-init:
    <<: *airflow-common
    restart: "no"
    command: >
      bash -lc "airflow db migrate &&
      (airflow users create
      --role Admin
      --username ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      --password ${_AIRFLOW_WWW_USER_PASSWORD:?Defina _AIRFLOW_WWW_USER_PASSWORD em security.env}
      --firstname SEI
      --lastname IA
      --email sei-ia@example.local ||
      airflow users list | grep -Fq '${_AIRFLOW_WWW_USER_USERNAME:-admin}')"
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_INIT_MEM_LIMIT}
          cpus: ${AIRFLOW_INIT_CPU_LIMIT}

  etl-airflow-webserver:
    <<: *airflow-common
    build:
      context: .
      network: host
      dockerfile: aplicacoes/etl-airflow/airflow.dockerfile
    command: airflow webserver
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "/home/airflow/app/healthcheck/airflow_webserver.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      etl-airflow-init:
        condition: service_completed_successfully
      infra-postgres-airflow:
        condition: service_healthy
      infra-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_WEBSERVER_MEM_LIMIT}
          cpus: ${AIRFLOW_WEBSERVER_CPU_LIMIT}

  etl-airflow-scheduler:
    <<: *airflow-common
    cpu_shares: ${AIRFLOW_SCHEDULER_CPU_SHARES}
    command: airflow scheduler
    healthcheck:
      test: ["CMD", "/home/airflow/app/healthcheck/airflow_scheduler.sh"]
      interval: 60s
      timeout: 20s
      retries: 10
      start_period: 30s
    depends_on:
      etl-airflow-init:
        condition: service_completed_successfully
      infra-postgres-airflow:
        condition: service_healthy
      infra-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_SCHEDULER_MEM_LIMIT}
          cpus: ${AIRFLOW_SCHEDULER_CPU_LIMIT}
      replicas: 1

  etl-airflow-worker:
    <<: *airflow-common
    command:
      - celery
      - worker
      - -H
      - airflow-worker@%h
    healthcheck:
      test: ["CMD", "/home/airflow/app/healthcheck/airflow_worker.sh"]
      interval: 60s
      timeout: 20s
      retries: 10
      start_period: 30s
    depends_on:
      etl-airflow-init:
        condition: service_completed_successfully
      infra-postgres-airflow:
        condition: service_healthy
      infra-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_WORKER_MEM_LIMIT}
          cpus: ${AIRFLOW_WORKER_CPU_LIMIT}
      replicas: ${AIRFLOW_WORKERS_REPLICAS}

  etl-airflow-triggerer:
    <<: *airflow-common
    command: airflow triggerer
    healthcheck:
      test: ["CMD", "/home/airflow/app/healthcheck/airflow_triggerer.sh"]
      interval: 60s
      timeout: 20s
      retries: 10
      start_period: 30s
    depends_on:
      etl-airflow-init:
        condition: service_completed_successfully
      infra-postgres-airflow:
        condition: service_healthy
      infra-rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_TRIGGERER_MEM_LIMIT}
          cpus: ${AIRFLOW_TRIGGERER_CPU_LIMIT}

  etl-airflow-api:
    <<: *app-common
    build:
      context: .
      network: host
      dockerfile: aplicacoes/etl-airflow/jobs_api.dockerfile
    image: sei-ia/etl-airflow-api:local
    command: >
      gunicorn -k uvicorn.workers.UvicornH11Worker --bind=0.0.0.0:8642 jobs.api:app
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:?Defina AIRFLOW_POSTGRES_PASSWORD em security.env}@infra-postgres-airflow:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      SEI_API_DB_ADDRESS: ${SEI_ADDRESS}/sei/controlador_ws.php
      SOLR_MLT_PROCESS_CORE: ${SOLR_MLT_PROCESS_CORE}
      SOLR_MLT_JURISPRUDENCE_CORE: ${SOLR_MLT_JURISPRUDENCE_CORE}
      MLT_PROCESS_CONFIGSET: /var/solr/configsets/process
      MLT_JURISPRUDENCE_CONFIGSET: /var/solr/configsets/jurisprudence
      CONN_STRING_APP_DB: postgresql+psycopg2://${DB_SEIIA_USER:-postgres}:${DB_SEIIA_PWD:?Defina DB_SEIIA_PWD em security.env}@infra-postgres:5432/${DB_SEIIA_SIMILARIDADE:-sei_similaridade}
      CONN_LOG_DB_STRING: postgresql+psycopg2://${DB_SEIIA_USER:-postgres}:${DB_SEIIA_PWD:?Defina DB_SEIIA_PWD em security.env}@infra-postgres:5432/${DB_SEIIA_SIMILARIDADE:-sei_similaridade}
      LITELLM_PROXY_URL: http://infra-litellm:4000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LITELLM_EMBEDDING_MODEL_NAME: embedding
      EMBEDDING_BASE_MODEL: ${LITELLM_EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8642/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      etl-airflow-webserver:
        condition: service_healthy
      infra-postgres:
        condition: service_healthy
      infra-solr:
        condition: service_healthy
      infra-redis:
        condition: service_started
      infra-litellm:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${ETL_AIRFLOW_API_MEM_LIMIT}
          cpus: ${ETL_AIRFLOW_API_CPU_LIMIT}

  infra-postgres-airflow:
    image: postgres:13@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    restart: unless-stopped
    networks:
      - seiia
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?Defina AIRFLOW_POSTGRES_PASSWORD em security.env}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${VOL_SEIIA_DIR}/airflow_postgres_vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_POSTGRES_MEM_LIMIT}
          cpus: ${AIRFLOW_POSTGRES_CPU_LIMIT}

  infra-rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    restart: unless-stopped
    networks:
      - seiia
    environment:
      RABBITMQ_DEFAULT_USER: ${AIRFLOW_AMQP_USER:-airflow}
      RABBITMQ_DEFAULT_PASS: ${AIRFLOW_AMQP_PASSWORD:?Defina AIRFLOW_AMQP_PASSWORD em security.env}
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${RABBITMQ_MEM_LIMIT}
          cpus: ${RABBITMQ_CPU_LIMIT}

  infra-postgres:
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    restart: unless-stopped
    init: true
    networks:
      - seiia
    env_file:
      - default.env
      - security.env
    environment:
      POSTGRES_DB: ${DB_SEIIA_ASSISTENTE:-sei_ia}
      POSTGRES_USER: ${DB_SEIIA_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_SEIIA_PWD:?Defina DB_SEIIA_PWD em security.env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${VOL_SEIIA_DIR}/pgvector_all_vol:/var/lib/postgresql/data
      - ./ops/database/ddl.sql:/docker-entrypoint-initdb.d/10-ddl.sql:ro
      - ./ops/database/conf/init_pgvector.sql:/docker-entrypoint-initdb.d/20-init_pgvector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_SEIIA_USER:-postgres} -d ${DB_SEIIA_ASSISTENTE:-sei_ia} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${PGVECTOR_MEM_LIMIT}
          cpus: ${PGVECTOR_CPU_LIMIT}

  infra-solr:
    build:
      context: .
      network: host
      dockerfile: ops/solr/solr.dockerfile
    image: sei-ia/infra-solr:local
    restart: unless-stopped
    networks:
      - seiia
    env_file:
      - default.env
      - security.env
    environment:
      SOLR_USER: ${SOLR_USER:-solr}
      SOLR_PASSWORD: ${SOLR_PASSWORD:?Defina SOLR_PASSWORD em security.env}
      SOLR_ULIMIT_CHECKS: "false"
    volumes:
      - ${VOL_SEIIA_DIR}/solr_pd_vol:/var/solr
    mem_limit: ${SOLR_MEM_LIMIT}
    cpus: ${SOLR_CPU_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -kfsS -u \"$$SOLR_USER:$$SOLR_PASSWORD\" https://localhost:8983/solr/admin/info/system >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    ulimits:
      nofile:
        soft: 65000
        hard: 65000

  infra-redis:
    image: redis:7.2-alpine@sha256:5f8bafd0669a697ee564ad825c2a63e6b60b0a67c02b0089f8a250051ab6fe85
    restart: unless-stopped
    networks:
      - seiia
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ping | grep PONG",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT}
          cpus: ${REDIS_CPU_LIMIT}

  infra-litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable@sha256:9ef6f45bc0104940571765e610c52a1d761b5ec85efcd193795281086ee61277
    restart: unless-stopped
    networks:
      - seiia
    command: --config /app/config.yaml --port ${LITELLM_PORT:-4000} --host 0.0.0.0
    environment:
      LITELLM_PROXY_API_KEY: ${LITELLM_PROXY_API_KEY:?Defina LITELLM_PROXY_API_KEY em security.env}
      LITELLM_STANDARD_MODEL: ${LITELLM_STANDARD_MODEL:?Defina LITELLM_STANDARD_MODEL em security.env}
      LITELLM_MINI_MODEL: ${LITELLM_MINI_MODEL:?Defina LITELLM_MINI_MODEL em security.env}
      LITELLM_NANO_MODEL: ${LITELLM_NANO_MODEL:?Defina LITELLM_NANO_MODEL em security.env}
      LITELLM_STANDARD_API_BASE: ${LITELLM_STANDARD_API_BASE:?Defina LITELLM_STANDARD_API_BASE em security.env}
      LITELLM_STANDARD_API_KEY: ${LITELLM_STANDARD_API_KEY:?Defina LITELLM_STANDARD_API_KEY em security.env}
      LITELLM_STANDARD_API_VERSION: ${LITELLM_STANDARD_API_VERSION:-}
      LITELLM_MINI_API_BASE: ${LITELLM_MINI_API_BASE:?Defina LITELLM_MINI_API_BASE em security.env}
      LITELLM_MINI_API_KEY: ${LITELLM_MINI_API_KEY:?Defina LITELLM_MINI_API_KEY em security.env}
      LITELLM_MINI_API_VERSION: ${LITELLM_MINI_API_VERSION:-}
      LITELLM_NANO_API_BASE: ${LITELLM_NANO_API_BASE:?Defina LITELLM_NANO_API_BASE em security.env}
      LITELLM_NANO_API_KEY: ${LITELLM_NANO_API_KEY:?Defina LITELLM_NANO_API_KEY em security.env}
      LITELLM_NANO_API_VERSION: ${LITELLM_NANO_API_VERSION:-}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:?Defina LITELLM_EMBEDDING_MODEL em security.env}
      LITELLM_EMBEDDING_API_BASE: ${LITELLM_EMBEDDING_API_BASE:?Defina LITELLM_EMBEDDING_API_BASE em security.env}
      LITELLM_EMBEDDING_API_KEY: ${LITELLM_EMBEDDING_API_KEY:?Defina LITELLM_EMBEDDING_API_KEY em security.env}
      LITELLM_EMBEDDING_API_VERSION: ${LITELLM_EMBEDDING_API_VERSION:-}
      LITELLM_STT_MODEL: ${LITELLM_STT_MODEL:?Defina LITELLM_STT_MODEL em security.env}
      LITELLM_STT_API_BASE: ${LITELLM_STT_API_BASE:?Defina LITELLM_STT_API_BASE em security.env}
      LITELLM_STT_API_KEY: ${LITELLM_STT_API_KEY:?Defina LITELLM_STT_API_KEY em security.env}
      LITELLM_STT_API_VERSION: ${LITELLM_STT_API_VERSION:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:4000/health/readiness', headers={'Authorization': 'Bearer ' + os.environ['LITELLM_PROXY_API_KEY']}))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${LITELLM_MEM_LIMIT}
          cpus: ${LITELLM_CPU_LIMIT}

  infra-searxng:
    <<: *websearch-common
    build:
      context: .
      network: host
      dockerfile: ops/searxng/searxng.dockerfile
    image: sei-ia/infra-searxng:local
    # Bind-mount do settings.yml do repo: tem precedência sobre o volume anônimo
    # que a imagem base searxng/searxng cria em /etc/searxng (VOLUME). Sem isto, um
    # volume persistente antigo mascara o settings.yml da imagem e o keep_only dos
    # engines não vale em runtime.
    volumes:
      - ./ops/searxng/settings.yml:/etc/searxng/settings.yml:ro
    env_file:
      - default.env
      - security.env
    environment:
      SEARXNG_BASE_URL: http://infra-searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY:?Defina SEARXNG_SECRET_KEY em security.env}
      UWSGI_WORKERS: "2"
    mem_limit: ${SEARXNG_MEM_LIMIT}
    cpus: ${SEARXNG_CPU_LIMIT}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  infra-lightpanda:
    <<: *websearch-common
    image: lightpanda/browser:nightly
    networks:
      seiia:
        aliases:
          - lightpanda
    command: ["/bin/lightpanda", "serve", "--host", "0.0.0.0", "--advertise-host", "lightpanda", "--port", "9222", "--log_level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9222'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${LIGHTPANDA_MEM_LIMIT}
    cpus: ${LIGHTPANDA_CPU_LIMIT}

  infra-chrome:
    <<: *websearch-common
    image: chromedp/headless-shell:latest
    command: ["--remote-allow-origins=*"]
    networks:
      seiia:
        aliases:
          - chrome
    shm_size: "1gb"
    mem_limit: ${CHROME_MEM_LIMIT}
    cpus: ${CHROME_CPU_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9222'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  infra-fastcrw:
    <<: *websearch-common
    image: ghcr.io/us/crw:latest
    environment:
      LIGHTPANDA_CDP_URL: ws://infra-lightpanda:9222
      CHROME_CDP_URL: ws://infra-chrome:9222
      BYPARR_URL: http://infra-byparr:8191
    volumes:
      - ./ops/fastcrw/config.default.toml:/app/config.default.toml:ro
    mem_limit: ${FASTCRW_MEM_LIMIT}
    cpus: ${FASTCRW_CPU_LIMIT}
    depends_on:
      infra-lightpanda:
        condition: service_healthy
      infra-chrome:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  infra-byparr:
    <<: *websearch-common
    image: ghcr.io/thephaseless/byparr:latest
    environment:
      LOG_LEVEL: INFO
    shm_size: "512mb"
    mem_limit: ${BYPARR_MEM_LIMIT}
    cpus: ${BYPARR_CPU_LIMIT}
    volumes:
      - byparr_camoufox_cache:/home/ubuntu/.cache/camoufox
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 -o /dev/null http://localhost:8191/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  infra-marker:
    <<: *websearch-common
    build:
      context: .
      network: host
      dockerfile: ops/marker/marker.dockerfile
    image: sei-ia/infra-marker:local
    mem_limit: ${MARKER_MEM_LIMIT}
    cpus: ${MARKER_CPU_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8082'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  stack-config-checker:
    build:
      context: .
      network: host
      dockerfile: ops/healthchecker.dockerfile
    profiles: ["checks"]
    env_file:
      - default.env
      - security.env
    environment:
      SOLR_ADDRESS: ${SOLR_ADDRESS}
      SOLR_HOST: ${SOLR_HOST}
      SEI_API_DB_ADDRESS: ${SEI_ADDRESS}/sei/controlador_ws.php
      LITELLM_PROXY_URL: ${ASSISTENTE_LITELLM_PROXY_URL}
    command: ["python3", "teste.py"]
    networks:
      - seiia
    depends_on:
      assistente:
        condition: service_healthy
      gateway-nginx:
        condition: service_healthy
      similaridade:
        condition: service_healthy
      similaridade-feedback:
        condition: service_healthy
      etl-airflow-api:
        condition: service_healthy
      etl-airflow-webserver:
        condition: service_healthy
      infra-postgres:
        condition: service_healthy
      infra-postgres-airflow:
        condition: service_healthy
      infra-rabbitmq:
        condition: service_healthy
      infra-redis:
        condition: service_healthy
      infra-solr:
        condition: service_healthy
      infra-litellm:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${STACK_CONFIG_CHECKER_MEM_LIMIT}
          cpus: ${STACK_CONFIG_CHECKER_CPU_LIMIT}
    volumes:
      - health_checker_logs:/opt/sei-ia-storage
      - ./:/opt/healthchecker
      # A tmpfs abaixo mascara toda a .runtime trazida pelo bind da worktree.
      # Somente o PEM publico e montado; a chave privada nao entra no checker.
      - ./.runtime/certs/seiia.cert.pem:/etc/ssl/certs/seiia.cert.pem:ro
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /opt/healthchecker/.runtime
    privileged: true

networks:
  seiia:
    name: ${COMPOSE_NETWORK_NAME:-docker-host-bridge}
    external: true

volumes:
  redis_data:
  health_checker_logs:
  byparr_camoufox_cache:
