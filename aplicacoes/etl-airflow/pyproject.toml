[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs"
version = "0.1.0"
description = "API de feedbacks das recomendacoes feitas pelo API SEI"
authors = [{name = "Anatel", email = "seiia@anatel.gov.br"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"

dependencies = [
    'fastapi==0.141.1',
    'starlette==1.6.0',
    'gunicorn',
    'uvicorn',
    'uvloop',
    'websockets',
    'httptools',
    'requests>=2.33.0',
    'pandas==2.1.4',
    'SQLAlchemy==1.4.49',
    'psycopg2-binary',
    'pgvector==0.4.2',
    'asyncpg',
    'tqdm==4.66.3',
    'pendulum',
    'ipython',
    "python-multipart>=0.0.31",
    "PyJWT>=2.15.0",
    "passlib==1.7.4",
    "nest-asyncio",
    "httpx[http2]",
    "beautifulsoup4>=4.12.3",
    "html5lib>=1.1",
    "w3lib==2.1.2",
    "lxml>=6.1.0",
    "langchain-text-splitters>=1.1.2,<2.0",
    "openai",
    "docling>=2.132.0",
    # Alinhadas com a base Airflow 2.9.3 para nao quebrar providers preinstalados.
    "fsspec>=2026.6.0",
    "markdown-it-py==3.0.0",
    "protobuf>=5.29.6",
    # Pacotes da base do Airflow 2.9.3 (webserver/OTel/PythonVirtualenvOperator) com
    # teto em protobuf, filelock ou packaging; as versoes abaixo aceitam o lock.
    "opentelemetry-exporter-otlp>=1.43.0",
    "limits>=5.0",
    "virtualenv>=21.15.2",
    # Pacotes da base do Airflow 2.9.3 que o core, o FAB ou o executor Celery exigem e que a
    # base traz em versoes vulneraveis; os pisos abaixo sobem a base sem quebrar o Airflow.
    "aiohttp>=3.14.4",
    "authlib>=1.9.1",
    "cryptography>=48.0.1",
    "dnspython>=2.9.0",
    "mako>=1.3.12",
    "pyasn1>=0.6.4",
    "pyasn1-modules>=0.4.2",
    "sqlparse>=0.6.0",
    "tornado>=6.5.9",
    # aiobotocore (provider amazon da base) exige wrapt<2; o Deprecated 1.3 traz o 2.x.
    "wrapt<2",
    "torch>=2.7.0,<3.0.0",
    "torchvision>=0.22.0,<1.0",
    "pymupdf>=1.24.0",
    "python-calamine>=0.2.0",
    "tiktoken>=0.7.0",
    "redis[hiredis]==5.0.8",
    "sei-extraction[extract]",
    "sei-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-xdist",
    "pytest-cov>=7.0.0",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-env",
    "ruff==0.14.10",
    "requests-mock",
    "coverage",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

airflow = [
    "SQLAlchemy==1.4.49",
    "apache-airflow==2.9.3",
    "apache-airflow-providers-postgres",
]
etls = [
    "pyarrow",
    "beautifulsoup4>=4.12.3",
    "tiktoken==0.7.0"
]

[dependency-groups]
# Instalada somente no container efemero do job de teste da candidata.
ci-test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-env==1.6.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["./tests/*", "./.conda/*"]

[tool.pytype]
inputs = [
    "pytype/*.py",
    "pytype/overlays/",
    "pytype/pyc/",
    "pytype/pyi/",
    "pytype/pytd/",
    "pytype/tools/",
    "pytype/typegraph/",
    "pytype_extensions/**/*.py",
]
exclude = [
    "tests/*",
    ".conda",
    ".pytype*",
    "__pypackages__",
    "venv",
    "*.egg-info",
    ".pytest*"
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "tests/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

ignore = [
    "E501", # O formatter cuida do wrapping; manter compatibilidade com o código atual.
    "B008", # FastAPI Path/Query/Body/Depends em defaults é padrão do projeto.
]

fixable = ["E", "W", "F", "I", "UP", "SIM", "C4"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
[tool.ruff.lint.pydocstyle]
# Google DocString Convention
convention = "google"

# Configuração uv para usar PyTorch CPU-only (sem CUDA/nvidia)
# Reduz imagem Docker de ~14.8GB para ~8GB
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
sei-extraction = { path = "../../libs/sei_extraction", editable = true }
sei-api = { path = "../../libs/sei_api", editable = true }
