sonar.projectKey=sei-ia_etl-airflow
sonar.projectName=SEI-IA ETL Airflow
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.sources=jobs,document_extraction
sonar.tests=tests
sonar.python.version=3.12

# Cobertura de testes
sonar.test.inclusions=tests/**/*.py
sonar.coverage.exclusions=\
  tests/**,\
  **/conftest.py

# Segurança - relatório bandit gerado antes do scan
sonar.python.bandit.reportPaths=/tmp/sonar-reports/etl-airflow/bandit-report.json

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.html,\
  jobs/configs/solr_core_configs/**/*.xml,\
  build/**,\
  *.egg-info/**
