sonar.projectKey=sei-ia_similaridade
sonar.projectName=SEI-IA Similaridade
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.sources=api_sei,app_api,db_connection
sonar.tests=tests
sonar.python.version=3.10

# Cobertura de testes
sonar.test.inclusions=tests/**/*.py
sonar.coverage.exclusions=\
  tests/**,\
  **/conftest.py

# Segurança - relatório bandit gerado antes do scan
sonar.python.bandit.reportPaths=/tmp/sonar-reports/similaridade/bandit-report.json

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.html,\
  build/**,\
  *.egg-info/**
