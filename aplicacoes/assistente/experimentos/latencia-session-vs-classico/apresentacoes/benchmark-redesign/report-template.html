<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benchmark Session — GPT-5.4 versus Terra/Luna</title>
  <style>
    :root {
      --navy:#0b2442; --navy-2:#173f6d; --cyan:#0e7490; --sky:#dff4fa;
      --ink:#172033; --muted:#5f6b7c; --line:#d7dfeb; --paper:#f5f8fc;
      --good:#166534; --good-bg:#eaf7ee; --warn:#92400e; --warn-bg:#fff7e6;
      --white:#fff; --shadow:0 12px 34px rgba(11,36,66,.09);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
    .wrap { width:min(1200px,calc(100% - 32px)); margin-inline:auto; min-width:0; }
    .hero { color:var(--white); background:linear-gradient(135deg,var(--navy),var(--navy-2) 70%,var(--cyan)); padding:54px 0 46px; }
    .eyebrow { margin:0 0 8px; text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; font-weight:800; opacity:.82; }
    h1 { margin:0; width:100%; max-width:900px; overflow-wrap:anywhere; font-size:clamp(2rem,5vw,4.2rem); line-height:1.12; letter-spacing:-.04em; padding-bottom:4px; }
    .hero .lead { max-width:900px; margin:20px 0 0; font-size:1.08rem; color:#dceafb; }
    .badges { display:flex; flex-wrap:wrap; gap:9px; margin-top:24px; }
    .badge { display:inline-flex; gap:7px; align-items:center; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:7px 11px; font-weight:750; background:rgba(255,255,255,.09); }
    nav { position:sticky; top:0; z-index:4; border-bottom:1px solid var(--line); background:rgba(255,255,255,.94); backdrop-filter:blur(10px); }
    nav .wrap { display:flex; gap:18px; overflow:auto; padding-block:12px; }
    nav a { flex:none; color:var(--navy); text-decoration:none; font-weight:750; }
    main { padding:30px 0 60px; }
    section { min-width:0; margin:0 0 24px; padding:28px; border:1px solid var(--line); border-radius:18px; background:var(--white); box-shadow:var(--shadow); }
    h2 { margin:0 0 8px; color:var(--navy); font-size:clamp(1.35rem,2.5vw,2rem); letter-spacing:-.02em; }
    h3 { margin:0 0 8px; color:var(--navy); }
    p { margin:8px 0 0; }
    .lede { margin-top:6px; color:var(--muted); max-width:950px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; min-width:0; }
    .grid.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .card { min-width:0; padding:18px; border:1px solid var(--line); border-radius:14px; background:#fbfdff; }
    .metric small { display:block; color:var(--muted); font-weight:700; }
    .metric strong { display:block; margin-top:5px; font-size:clamp(1.45rem,3vw,2.3rem); color:var(--navy); letter-spacing:-.03em; }
    .metric span { display:block; margin-top:3px; color:var(--good); font-weight:800; }
    .table-shell { max-width:100%; overflow-x:auto; margin-top:16px; border:1px solid var(--line); border-radius:13px; }
    table { width:100%; border-collapse:collapse; min-width:760px; background:var(--white); }
    caption { padding:12px 14px; text-align:left; color:var(--muted); font-weight:700; background:#f7faff; }
    th,td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; }
    thead th { color:var(--navy); background:#edf4fb; font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; }
    tbody tr:last-child th,tbody tr:last-child td { border-bottom:0; }
    th.num,td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    td.winner { background:var(--good-bg); color:var(--good); font-weight:800; box-shadow:inset 0 0 0 1px rgba(22,101,52,.09); }
    .winner-legend { display:inline-flex; align-items:center; gap:7px; margin-top:14px; color:var(--muted); font-size:.9rem; }
    .winner-swatch { display:inline-block; width:16px; height:16px; border:1px solid rgba(22,101,52,.18); border-radius:3px; background:var(--good-bg); }
    .warning { margin-top:16px; padding:15px 17px; border-left:5px solid var(--warn); border-radius:10px; background:var(--warn-bg); }
    .status { font-weight:800; }
    .status.ok { color:var(--good); }
    code,.mono { overflow-wrap:anywhere; word-break:break-word; font:0.88em ui-monospace,SFMono-Regular,Consolas,monospace; }
    ul { margin:10px 0 0; padding-left:20px; }
    .foot { color:var(--muted); text-align:center; padding:12px 0 44px; }
    @media (max-width:900px) { .grid.four { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:680px) { .wrap { width:min(100% - 18px,1200px); } section { padding:20px; } .grid,.grid.four { grid-template-columns:1fr; } }
    @media print { nav { display:none; } body { background:white; } section { box-shadow:none; break-inside:avoid; } }
  </style>
</head>
<body>
  <!-- REPORT BODY -->
  <footer class="foot wrap">Gerado por <code>benchmark-redesign/build_report.py</code>.</footer>
</body>
</html>
