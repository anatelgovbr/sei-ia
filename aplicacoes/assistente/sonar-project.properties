sonar.projectKey=sei-ia_assistente
sonar.projectName=SEI-IA Assistente
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.sources=sei_ia
sonar.tests=tests
sonar.python.version=3.12

# Cobertura de testes (unitários + e2e + services + rag)
# O caminho do coverage.xml é injetado pelo scan-all.sh com paths corrigidos
sonar.test.inclusions=tests/**/*.py
sonar.coverage.exclusions=\
  tests/**,\
  **/conftest.py,\
  scripts/**,\
  temp/**,\
  sei_ia/main.py,\
  sei_ia/configs/gunicorn_conf.py,\
  sei_ia/configs/langfuse_config.py,\
  sei_ia/middleware/middleware_custom.py,\
  sei_ia/middleware/middleware_timeout.py,\
  sei_ia/data/database/async_db_connection.py,\
  sei_ia/data/database/db_instances.py,\
  sei_ia/data/database/sei_db_handlers.py,\
  sei_ia/data/database/solr_handlers.py,\
  sei_ia/data/database/table_manager.py,\
  sei_ia/data/etl/concatenate_documents.py,\
  sei_ia/data/etl/extract/external.py,\
  sei_ia/data/etl/extract/internal.py,\
  sei_ia/data/etl/extract/metadata.py,\
  sei_ia/data/etl/extract/pdf_ocr_extractor.py,\
  sei_ia/routers/chat/__init__.py,\
  sei_ia/routers/chat/rlm_stream.py,\
  sei_ia/routers/feedback.py,\
  sei_ia/services/async_llm_requests/api_requests_from_file.py,\
  sei_ia/services/async_llm_requests/async_requests.py,\
  sei_ia/services/async_llm_requests/llm_async_pool.py,\
  sei_ia/services/cache/cache_cleanup_service.py,\
  sei_ia/services/cache/redis_client.py,\
  sei_ia/services/embedder/chunk_retriever.py,\
  sei_ia/services/embedder/pipeline.py,\
  sei_ia/services/embedder/providers/azure.py,\
  sei_ia/services/llm_models/chat_workflow.py,\
  sei_ia/services/rlm/engine_repl.py,\
  sei_ia/services/rlm/graph.py,\
  sei_ia/services/rlm/intent_prompts.py,\
  sei_ia/agents/chat_completion_graph.py,\
  sei_ia/agents/intent_selector_agent.py,\
  sei_ia/agents/memory/session/conversation.py,\
  sei_ia/agents/pergunta/__init__.py,\
  sei_ia/agents/pergunta/auto_indexing.py,\
