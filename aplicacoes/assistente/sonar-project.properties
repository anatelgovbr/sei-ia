  sei_ia/agents/session_agent/status_emitter.py,\
  sei_ia/routers/session/stream.py,\
  sei_ia/services/session_fs/debug.py,\
  sei_ia/services/session_fs/runtime.py,\
  sei_ia/services/session_fs/checkpointer.py,\
  sei_ia/agents/disclaimer/disclaimer_classifier.py,\
  sei_ia/agents/rag/__init__.py,\
  sei_ia/data/etl/extract/doc_content.py,\
  sei_ia/agents/websearch/deep_research_agent.py

# Segurança - relatório bandit gerado antes do scan
sonar.python.bandit.reportPaths=/tmp/sonar-reports/assistente/bandit-report.json

sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.html,\
  htmlcov/**,\
  build/**,\
  *.egg-info/**,\
  scripts/**,\
  temp/**
