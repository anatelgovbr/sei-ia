[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sei-api"
version = "0.1.0"
description = "Cliente HTTP unificado da API do SEI (consulta, listagem e atualização de documentos e processos)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests",
    "httpx",
    "pandas",
    "urllib3",
    "defusedxml",
    "tenacity",
    "sei-extraction",
]

[tool.uv.sources]
sei-extraction = { path = "../sei_extraction", editable = true }

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/sei_api"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/sei_api"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
